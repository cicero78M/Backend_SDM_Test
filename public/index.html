<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD App Test</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div><p class="eyebrow">PROJECT PREPARATION</p><h1>Data Items</h1><p class="muted">Kelola data melalui operasi create, read, update, dan delete.</p></div>
        <button id="newButton" class="button primary">+ Data baru</button>
      </header>
      <section id="alert" class="alert hidden" role="alert"></section>
      <section class="card">
        <div class="toolbar"><h2>Daftar data</h2><input id="search" type="search" placeholder="Cari nama atau deskripsi..." /></div>
        <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Deskripsi</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody id="itemsBody"></tbody></table><p id="emptyState" class="empty">Belum ada data.</p></div>
      </section>
    </main>
    <dialog id="itemDialog"><form id="itemForm" method="dialog" class="form-card"><div class="form-header"><h2 id="dialogTitle">Data baru</h2><button type="button" id="closeButton" class="icon-button">×</button></div><input type="hidden" id="itemId" /><label>Nama<input id="name" maxlength="120" required /></label><label>Deskripsi<textarea id="description" maxlength="500" rows="4"></textarea></label><label>Status<select id="status"><option value="active">Aktif</option><option value="inactive">Tidak aktif</option></select></label><div class="form-actions"><button type="button" id="cancelButton" class="button">Batal</button><button class="button primary">Simpan</button></div></form></dialog>
    <script src="/app.js"></script>
  </body>
</html>
