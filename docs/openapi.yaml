openapi: 3.0.3
info:
  title: Backend SDM Test - REST API
  version: 1.0.0
  description: API Merit System Personel Polri untuk CRUD personel dan riwayat jabatan dengan JWT, validasi, role, scope organisasi, dan response error terstandar.
servers:
  - url: http://localhost:3000/api/v1
    description: Development lokal
  - url: https://103.93.129.65/api/v1
    description: Deployment HTTPS berbasis IP
paths:
  /auth/register:
    post:
      summary: Registrasi user
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses: { '201': { description: OTP validasi email dikirim }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '503': { description: Email OTP gagal dikirim }, '500': { $ref: '#/components/responses/ServerError' } }
  /auth/register/verify-email:
    post:
      summary: Memvalidasi OTP email registrasi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterVerifyEmailRequest' } } }
      responses: { '200': { description: Email tervalidasi }, '400': { $ref: '#/components/responses/BadRequest' }, '429': { description: Batas percobaan tercapai } }
  /auth/register/resend-otp:
    post:
      summary: Mengirim ulang OTP registrasi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResendOtpRequest' } } }
      responses: { '200': { description: OTP baru dikirim }, '404': { description: Registrasi tidak ditemukan }, '429': { description: Cooldown OTP belum selesai } }
  /auth/login:
    post:
      summary: Login dan mendapatkan JWT
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses: { '200': { description: Login berhasil }, '401': { description: Kredensial salah } }
  /pegawai:
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar pegawai dengan pagination dan pencarian
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
      responses: { '200': { description: Daftar pegawai }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Membuat pegawai (admin/editor)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PegawaiRequest' } } }
      responses: { '201': { description: Data dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '500': { $ref: '#/components/responses/ServerError' } }
  /pegawai/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Detail pegawai
      responses: { '200': { description: Data pegawai }, '404': { description: Tidak ditemukan } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Memperbarui pegawai (admin/editor)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PegawaiRequest' } } }
      responses: { '200': { description: Data diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus pegawai (admin)
      responses: { '204': { description: Data dihapus }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel:
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar personel sesuai scope user
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
      responses: { '200': { description: Daftar personel }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Membuat personel dalam scope Satker
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonelRequest' } } }
      responses: { '201': { description: Personel berhasil dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '500': { $ref: '#/components/responses/ServerError' } }
  /personel/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Detail personel dalam scope user
      responses: { '200': { description: Detail personel }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Memperbarui personel dalam scope
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PersonelRequest' } } }
      responses: { '200': { description: Personel diperbarui dengan projection yang sama seperti daftar personel }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Personel tidak ditemukan }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '500': { $ref: '#/components/responses/ServerError' } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus personel dalam scope user yang berwenang
      responses: { '204': { description: Personel dihapus }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/users/{id}/scopes:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Melihat scope Satker user (admin)
      responses: { '200': { description: Daftar scope user }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Mengganti scope Satker user (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [id_satker], properties: { id_satker: { type: array, items: { type: integer, minimum: 1 }, maxItems: 100 } } } } }
      responses: { '200': { description: Scope diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/registrations/pending:
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar registrasi yang menunggu approval admin
      responses: { '200': { description: Daftar registrasi }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/registrations/history:
    get:
      security: [{ bearerAuth: [] }]
      summary: Riwayat keputusan registrasi
      responses: { '200': { description: Riwayat registrasi }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/registrations/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    patch:
      security: [{ bearerAuth: [] }]
      summary: Menyetujui atau menolak registrasi
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] }, approved_role: { type: string }, note: { type: string, nullable: true } } } } }
      responses: { '200': { description: Registrasi diproses }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/users/approved:
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar user aktif
      responses: { '200': { description: Daftar user }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/users/{id}/role:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    patch:
      security: [{ bearerAuth: [] }]
      summary: Mengubah role user
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string } } } } }
      responses: { '200': { description: Role diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/users/{id}/status:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    patch:
      security: [{ bearerAuth: [] }]
      summary: Mengubah status aktif user
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [is_active], properties: { is_active: { type: boolean }, reason: { type: string, nullable: true } } } } }
      responses: { '200': { description: Status user diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca user yang sedang login
      responses: { '200': { description: Profil sesi }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/me/password:
    put:
      security: [{ bearerAuth: [] }]
      summary: Mengubah password sendiri
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } } } } }
      responses: { '204': { description: Password diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/forgot-password:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username], properties: { username: { type: string } } } } }
      responses: { '200': { description: Permintaan reset diproses } }
  /auth/reset-password:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, new_password], properties: { token: { type: string }, new_password: { type: string, minLength: 8 } } } } }
      responses: { '204': { description: Password direset }, '400': { $ref: '#/components/responses/BadRequest' } }
  /auth/users/{id}/password:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    put:
      security: [{ bearerAuth: [] }]
      summary: Reset password oleh admin
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [new_password], properties: { new_password: { type: string, minLength: 8 } } } } }
      responses: { '204': { description: Password diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel/{id}/profile:
    get:
      security: [{ bearerAuth: [] }]
      summary: Profil personel dan histori jabatan kronologis
      responses: { '200': { description: Profil personel }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
  /personel/{id}/riwayat-jabatan:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar riwayat jabatan personel
      responses: { '200': { description: Histori kronologis }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Menambahkan riwayat jabatan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RiwayatJabatanRequest' } } }
      responses: { '201': { description: Histori dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Histori aktif bertumpang tindih } }
  /personel/{id}/riwayat-jabatan/{historyId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: historyId, required: true, schema: { type: integer } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Memperbarui riwayat jabatan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RiwayatJabatanRequest' } } }
      responses: { '200': { description: Histori diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { description: Tidak ditemukan } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus riwayat jabatan
      responses: { '204': { description: Histori dihapus }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
  /personel/{id}/pendidikan:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar riwayat pendidikan personel
      responses: { '200': { description: Daftar pendidikan }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Menambahkan riwayat pendidikan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EducationRequest' } } }
      responses: { '201': { description: Pendidikan dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel/{id}/pendidikan/{educationId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: educationId, required: true, schema: { type: integer } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Memperbarui riwayat pendidikan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EducationRequest' } } }
      responses: { '200': { description: Pendidikan diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { description: Tidak ditemukan } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus riwayat pendidikan
      responses: { '204': { description: Pendidikan dihapus }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
  /personel/{id}/diklat:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Daftar riwayat diklat personel
      responses: { '200': { description: Daftar diklat }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Menambahkan riwayat diklat
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrainingRequest' } } }
      responses: { '201': { description: Diklat dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel/{id}/diklat/{trainingId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: trainingId, required: true, schema: { type: integer } }
    put:
      security: [{ bearerAuth: [] }]
      summary: Memperbarui riwayat diklat
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrainingRequest' } } }
      responses: { '200': { description: Diklat diperbarui }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { description: Tidak ditemukan } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus riwayat diklat
      responses: { '204': { description: Diklat dihapus }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
  /dashboard/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Agregasi dashboard sesuai scope user
      responses: { '200': { description: Ringkasan analitik }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/satker:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master Satker
      responses: { '200': { description: Daftar Satker }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/satker/tree:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca hierarki Satker
      responses: { '200': { description: Hierarki Satker }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/satker/{id}/fungsi:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca fungsi pada Satker
      responses: { '200': { description: Daftar fungsi }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/satker/{id}/unit-kerja:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca unit kerja pada Satker
      responses: { '200': { description: Daftar unit kerja }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/fungsi:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master fungsi
      responses: { '200': { description: Daftar fungsi }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/level-jabatan:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master level jabatan
      responses: { '200': { description: Daftar level jabatan }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/status-jabatan:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master status jabatan
      responses: { '200': { description: Daftar status jabatan }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/unit-kerja:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master unit kerja
      responses: { '200': { description: Daftar unit kerja }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/jabatan:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master jabatan
      responses: { '200': { description: Daftar jabatan }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /master/golongan:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca master golongan
      responses: { '200': { description: Daftar master data }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /merit/indicators:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca indikator merit aktif
      responses: { '200': { description: Daftar indikator }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /merit/periods:
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca periode merit
      responses: { '200': { description: Daftar periode }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /personel/{id}/merit:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get:
      security: [{ bearerAuth: [] }]
      summary: Membaca penilaian merit personel
      responses: { '200': { description: Data merit }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel/{id}/merit-assessments:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    post:
      security: [{ bearerAuth: [] }]
      summary: Menambahkan penilaian merit
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [id_period, id_indicator, nilai_raw], properties: { id_period: { type: integer }, id_indicator: { type: integer }, nilai_raw: { type: number, minimum: 0, maximum: 100 }, bukti: { type: string, nullable: true }, status: { type: string } } } } }
      responses: { '201': { description: Penilaian dibuat }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /personel/{id}/merit-assessments/{assessmentId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: assessmentId, required: true, schema: { type: integer } }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Menghapus penilaian merit
      responses: { '204': { description: Penilaian dihapus }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Tidak ditemukan } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    ErrorDetail:
      type: object
      properties:
        field: { type: string, description: Nama field yang gagal divalidasi }
        label: { type: string, description: Label field yang ramah operator }
        message: { type: string, description: Alasan validasi gagal }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Pesan error yang aman ditampilkan ke client }
        code: { type: string, nullable: true, description: Kode error opsional untuk client }
        details:
          type: array
          description: Detail validasi per field jika tersedia.
          items: { $ref: '#/components/schemas/ErrorDetail' }
    RegisterRequest: { type: object, required: [username, email, nama, pangkat, nip, satker_asal, password], properties: { username: { type: string, minLength: 3 }, email: { type: string, format: email }, nama: { type: string }, pangkat: { type: string }, nip: { type: string }, satker_asal: { type: string }, password: { type: string, minLength: 8 } } }
    RegisterVerifyEmailRequest: { type: object, required: [registration_id, otp], properties: { registration_id: { type: integer, minimum: 1 }, otp: { type: string, pattern: '^\d{6}$' } } }
    RegisterResendOtpRequest: { type: object, required: [registration_id], properties: { registration_id: { type: integer, minimum: 1 } } }
    LoginRequest: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
    PegawaiRequest:
      type: object
      required: [nip, jenis_personel, jenis_identitas, nik, nama, jenis_kelamin, tanggal_lahir, id_unit, id_jabatan]
      properties:
        nip: { type: string, pattern: '^\d{8,18}$', description: NRP 8 digit atau NIP 18 digit }
        jenis_personel: { type: string, enum: [POLRI, ASN, PPPK, HONORER, LAINNYA] }
        jenis_identitas: { type: string, enum: [NRP, NIP] }
        nik: { type: string, pattern: '^\d{16}$' }
        nama: { type: string }
        jenis_kelamin: { type: string, enum: [L, P] }
        tanggal_lahir: { type: string, format: date }
        tanggal_masuk: { type: string, format: date, nullable: true }
        id_unit: { type: integer }
        id_jabatan: { type: integer }
        id_golongan: { type: integer, nullable: true }
        pangkat: { type: string, maxLength: 80, nullable: true }
    PersonelRequest:
      allOf:
        - $ref: '#/components/schemas/PegawaiRequest'
        - type: object
          required: [id_satker]
          properties:
            id_satker: { type: integer, minimum: 1 }
    RiwayatJabatanRequest:
      type: object
      required: [id_jabatan, id_satker, id_status_jabatan, tanggal_mulai]
      properties:
        id_jabatan: { type: integer, minimum: 1 }
        id_satker: { type: integer, minimum: 1 }
        id_fungsi: { type: integer, nullable: true }
        id_level_jabatan: { type: integer, nullable: true }
        id_status_jabatan: { type: integer, minimum: 1 }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date, nullable: true }
        keterangan: { type: string, maxLength: 2000, nullable: true }
    EducationRequest:
      type: object
      required: [jenjang, institusi]
      properties:
        jenjang: { type: string, enum: [SD, SMP, SMA, D1, D2, D3, D4, S1, S2, S3] }
        institusi: { type: string, minLength: 2, maxLength: 150 }
        jurusan: { type: string, maxLength: 150, nullable: true }
        tahun_lulus: { type: integer, minimum: 1900, nullable: true }
        nomor_ijazah: { type: string, maxLength: 100, nullable: true }
        keterangan: { type: string, maxLength: 1000, nullable: true }
    TrainingRequest:
      type: object
      required: [nama_diklat]
      properties:
        nama_diklat: { type: string, minLength: 2, maxLength: 200 }
        jenis_diklat: { type: string, maxLength: 100, nullable: true }
        penyelenggara: { type: string, maxLength: 150, nullable: true }
        tanggal_mulai: { type: string, format: date, nullable: true }
        tanggal_selesai: { type: string, format: date, nullable: true }
        jam_pelajaran: { type: integer, minimum: 0, nullable: true }
        nilai: { type: number, minimum: 0, maximum: 100, nullable: true }
        nomor_sertifikat: { type: string, maxLength: 100, nullable: true }
        keterangan: { type: string, maxLength: 1000, nullable: true }
  responses:
    BadRequest:
      description: Request tidak valid, JSON rusak, format data salah, atau validasi schema gagal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            validation:
              value:
                error: Validasi gagal.
                details:
                  - { field: nip, label: NRP/NIP, message: NRP POLRI harus tepat 8 digit. }
            malformedJson:
              value: { error: Format JSON request tidak valid. }
    Unauthorized:
      description: Token Bearer tidak valid, tidak ada, kedaluwarsa, atau user tidak aktif.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Permission atau scope organisasi tidak mengizinkan operasi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Konflik data, termasuk NRP/NIP atau NIK yang sudah digunakan personel lain.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Body request melebihi batas 100 KB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: Ukuran request terlalu besar. }
    ServerError:
      description: Kesalahan internal yang tidak terduga. Detail teknis hanya dicatat di log server.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: Terjadi kesalahan pada server. }
